<!DOCTYPE html>

<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Student Notes Portal</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:20px;
}

.container{
max-width:600px;
margin:auto;
}

.card{
background:#fff;
padding:20px;
border-radius:10px;
margin-bottom:20px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h2{
margin-bottom:15px;
text-align:center;
}

input,select,button{
width:100%;
padding:12px;
margin-top:10px;
border:1px solid #ccc;
border-radius:5px;
}

button{
background:#0066ff;
color:#fff;
border:none;
cursor:pointer;
font-weight:bold;
}

button:hover{
opacity:.9;
}

#dashboard{
display:none;
}

.note{
display:block;
padding:12px;
background:#f0f0f0;
margin-top:10px;
border-radius:5px;
text-decoration:none;
color:#000;
font-weight:bold;
}

.note:hover{
background:#e0e0e0;
}

#welcome{
text-align:center;
margin-bottom:15px;
}

</style>

</head>
<body>

<div class="container">

<div class="card">

<h2>Registration</h2>

<input type="text" id="name" placeholder="Name">

<input type="text" id="phone" placeholder="Phone Number">

<select id="category" onchange="loadOptions()">

<option value="">Select Category</option>

<option value="School">Class 5-12</option>

<option value="Graduation">Graduation</option>

<option value="Masters">Masters</option>

</select>

<select id="classValue">
<option value="">Select Option</option>
</select>

<input type="password" id="password" placeholder="Password">

<button onclick="registerUser()">
Register
</button>

</div>

<div class="card">

<h2>Login</h2>

<input type="text" id="loginPhone" placeholder="Phone Number">

<input type="password"
id="loginPassword"
placeholder="Password">

<button onclick="loginUser()">
Login
</button>

</div>

<div class="card" id="dashboard">

<h2 id="welcome"></h2>

<div id="notes"></div>

</div>

</div>

<script>

const STUDENT_API =
"https://script.google.com/macros/s/AKfycbzP8kqlSQief10B7Ey_umeX4LY4zEB7EcSf_Hn96r71oJQdaZp11Oz_zHN9ZrJ6Hwex/exec";

const NOTES_API =
"https://script.google.com/macros/s/AKfycbwAaHIUc5gL9-a7ZzZKLzc66ETOOArfkzDZe4_Z2QFC_akEbrPFaTbbEmRpNR1-BkAAkg/exec";

function loadOptions(){

const category =
document.getElementById("category").value;

let html =
'<option value="">Select Option</option>';

if(category==="School"){

for(let i=5;i<=12;i++){

html +=
`<option value="${i}">
Class ${i}
</option>`;

}

}

if(category==="Graduation"){

for(let i=1;i<=6;i++){

html +=
`<option value="Sem-${i}">
Semester ${i}
</option>`;

}

}

if(category==="Masters"){

for(let i=1;i<=4;i++){

html +=
`<option value="MSem-${i}">
Masters Semester ${i}
</option>`;

}

}

document.getElementById("classValue")
.innerHTML = html;

}

async function registerUser(){

const data = {

action:"register",

name:
document.getElementById("name").value,

phone:
document.getElementById("phone").value,

category:
document.getElementById("category").value,

classValue:
document.getElementById("classValue").value,

password:
document.getElementById("password").value

};

try{

const response =
await fetch(STUDENT_API,{
method:"POST",

body:JSON.stringify(data)

});

const result =
await response.json();

alert(result.message);

}catch(error){

alert("Registration Error");

}

}

async function loginUser(){

try{

const response =
await fetch(STUDENT_API,{
method:"POST",

body:JSON.stringify({

action:"login",

phone:
document.getElementById("loginPhone").value,

password:
document.getElementById("loginPassword").value

})

});

const result =
await response.json();

if(!result.status){

alert("Login Failed");

return;

}

document.getElementById("dashboard")
.style.display="block";

document.getElementById("welcome")
.innerHTML =
"Welcome " + result.name;

loadNotes(result.classValue);

}catch(error){

alert("Login Error");

}

}

async function loadNotes(classValue){

try{

const response =
await fetch(NOTES_API,{

method:"POST",

body:JSON.stringify({

action:"getNotes",

classValue:classValue

})

});

const notes =
await response.json();

let html = "";

if(notes.length===0){

html =
"<p>No Notes Available</p>";

}else{

notes.forEach(note=>{

html +=

`<a class="note"
href="${note.url}"
target="_blank">

${note.subject}

</a>`;

});

}

document.getElementById("notes")
.innerHTML = html;

}catch(error){

document.getElementById("notes")
.innerHTML =
"Error Loading Notes";

}

}

</script>

</body>
</html>
