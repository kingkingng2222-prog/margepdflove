<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Notes Portal</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
}

.card{
    background:#fff;
    padding:20px;
    margin-bottom:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

h2{
    text-align:center;
}

input,select,button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    background:#0d6efd;
    color:#fff;
    border:none;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

#dashboard{
    display:none;
}

.note{
    display:block;
    padding:12px;
    margin-top:10px;
    background:#eee;
    text-decoration:none;
    color:#000;
    border-radius:5px;
}
</style>

</head>
<body>

<div class="container">

<div class="card">

<h2>Registration</h2>

<input type="text" id="name" placeholder="Name">

<input type="text" id="phone" placeholder="Phone Number">

<select id="category" onchange="loadOptions()">

<option value="">Select Category</option>

<option value="School">Class 5-12</option>

<option value="Graduation">Graduation</option>

<option value="Masters">Masters</option>

</select>

<select id="classValue">
<option value="">Select Class</option>
</select>

<input type="password" id="password" placeholder="Password">

<button onclick="registerUser()">Register</button>

</div>

<div class="card">

<h2>Login</h2>

<input type="text" id="loginPhone" placeholder="Phone Number">

<input type="password" id="loginPassword" placeholder="Password">

<button onclick="loginUser()">Login</button>

</div>

<div class="card" id="dashboard">

<h2 id="welcome"></h2>

<div id="notes"></div>

</div>

</div>

<script>

const STUDENT_API =
"https://script.google.com/macros/s/AKfycbzP8kqlSQief10B7Ey_umeX4LY4zEB7EcSf_Hn96r71oJQdaZp11Oz_zHN9ZrJ6Hwex/exec";

const NOTES_API =
"https://script.google.com/macros/s/AKfycbwAaHIUc5gL9-a7ZzZKLzc66ETOOArfkzDZe4_Z2QFC_akEbrPFaTbbEmRpNR1-BkAAkg/exec";

function loadOptions(){

    const category =
    document.getElementById("category").value;

    let html =
    '<option value="">Select Option</option>';

    if(category==="School"){

        for(let i=5;i<=12;i++){

            html +=
            `<option value="${i}">
            Class ${i}
            </option>`;

        }

    }

    if(category==="Graduation"){

        for(let i=1;i<=6;i++){

            html +=
            `<option value="Sem-${i}">
            Semester ${i}
            </option>`;

        }

    }

    if(category==="Masters"){

        for(let i=1;i<=4;i++){

            html +=
            `<option value="MSem-${i}">
            Masters Semester ${i}
            </option>`;

        }

    }

    document.getElementById("classValue").innerHTML = html;
}

async function registerUser(){

    try{

        const registerUrl =
        STUDENT_API +
        "?action=register" +
        "&name=" + encodeURIComponent(document.getElementById("name").value) +
        "&phone=" + encodeURIComponent(document.getElementById("phone").value) +
        "&category=" + encodeURIComponent(document.getElementById("category").value) +
        "&classValue=" + encodeURIComponent(document.getElementById("classValue").value) +
        "&password=" + encodeURIComponent(document.getElementById("password").value);

        const response =
        await fetch(registerUrl);

        const registerData =
        await response.json();

        alert(registerData.message);

    }catch(error){

        console.error(error);
        alert("Registration Error");

    }

}

async function loginUser(){

    try{

        const loginUrl =
        STUDENT_API +
        "?action=login" +
        "&phone=" + encodeURIComponent(document.getElementById("loginPhone").value) +
        "&password=" + encodeURIComponent(document.getElementById("loginPassword").value);

        const response =
        await fetch(loginUrl);

        const loginData =
        await response.json();

        if(!loginData.status){

            alert("Login Failed");
            return;

        }

        document.getElementById("dashboard").style.display="block";

        document.getElementById("welcome").innerText =
        "Welcome " + loginData.name;

        loadNotes(loginData.classValue);

    }catch(error){

        console.error(error);
        alert("Login Error");

    }

}

async function loadNotes(classValue){

    try{

        const notesUrl =
        NOTES_API +
        "?action=getNotes" +
        "&classValue=" + encodeURIComponent(classValue);

        const response =
        await fetch(notesUrl);

        const notesData =
        await response.json();

        let html = "";

        if(notesData.length===0){

            html =
            "<p>No Notes Found</p>";

        }else{

            notesData.forEach(note=>{

                html +=
                `<a class="note"
                href="${note.url}"
                target="_blank">
                ${note.subject}
                </a>`;

            });

        }

        document.getElementById("notes").innerHTML = html;

    }catch(error){

        console.error(error);

        document.getElementById("notes").innerHTML =
        "Notes Loading Error";

    }

}

</script>

</body>
</html>
